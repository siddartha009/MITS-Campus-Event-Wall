<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — Campus Event Wall</title>
<meta name="theme-color" content="#5e3f22">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">📌 Campus <span>Event Wall</span></div>
    <nav>
      <a class="navlink" href="index.html">Home</a>
      <a class="navlink" href="calendar.html">Calendar</a>
      <a class="navlink" id="nav-polls" style="display:none;" href="polls.html">Polls</a>
      <a class="navlink" id="nav-organize" style="display:none;" href="organize.html">Organize Event</a>
      <a class="navlink" id="nav-admin" style="display:none;" href="admin.html">Admin Review</a>
      <a class="navlink" id="nav-approvals" style="display:none;" href="approvals.html">Approvals</a>
      <a class="navlink" id="nav-login" style="display:none;" href="login.html">Login</a>
      <a class="navlink active" id="nav-register" style="display:none;" href="register.html">Create Account</a>
      <button class="navlink" id="nav-logout" style="display:none;">Logout</button>
      <span class="user-pill" id="nav-user-pill" style="display:none;"></span>
      <a class="navlink" href="https://mits.ac.in" target="_blank" rel="noopener">MITS Site</a>
    </nav>
  </div>

  <div class="page">
    <h1 class="page-title">Create Account</h1>
    <div class="note form-box">
      <label>I am a</label>
      <select id="r-role">
        <option value="student">Student</option>
        <option value="faculty">Faculty</option>
      </select>
      <label>Full name</label>
      <input id="r-name" type="text">
      <label>Department</label>
      <select id="r-dept"><option value="">Select your department</option></select>
      <label>College mail</label>
      <input id="r-email" type="email" placeholder="ID@mits.ac.in" autocomplete="email">
      <p class="field-hint" id="r-hint">Use your 10-character college ID mail. We'll send a verification link to it.</p>
      <label>Password</label>
      <div class="password-field">
        <input id="r-password" type="password">
        <button type="button" class="toggle-password" id="r-password-toggle">Show</button>
      </div>
      <label>Confirm Password</label>
      <div class="password-field">
        <input id="r-password2" type="password">
        <button type="button" class="toggle-password" id="r-password2-toggle">Show</button>
      </div>
      <button class="btn" id="r-submit" style="margin-top:18px;">Create Account</button>
      <div id="r-msg" class="form-msg" style="display:none;"></div>
      <p style="margin-top:14px;font-size:.9em;">Already have an account? <a href="login.html">Log in</a>.</p>
    </div>
  </div>

  <script type="module" src="js/register.js"></script>
</body>
</html>
