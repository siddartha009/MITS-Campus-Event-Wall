<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar — Campus Event Wall</title>
<meta name="theme-color" content="#5e3f22">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">📌 Campus <span>Event Wall</span></div>
    <nav>
      <a class="navlink" href="index.html">Home</a>
      <a class="navlink active" href="calendar.html">Calendar</a>
      <a class="navlink" id="nav-polls" style="display:none;" href="polls.html">Polls</a>
      <a class="navlink" id="nav-organize" style="display:none;" href="organize.html">Organize Event</a>
      <a class="navlink" id="nav-admin" style="display:none;" href="admin.html">Admin Review</a>
      <a class="navlink" id="nav-approvals" style="display:none;" href="approvals.html">Approvals</a>
      <a class="navlink" id="nav-login" style="display:none;" href="login.html">Login</a>
      <a class="navlink" id="nav-register" style="display:none;" href="register.html">Create Account</a>
      <button class="navlink" id="nav-logout" style="display:none;">Logout</button>
      <span class="user-pill" id="nav-user-pill" style="display:none;"></span>
      <a class="navlink" href="https://mits.ac.in" target="_blank" rel="noopener">MITS Site</a>
    </nav>
  </div>

  <div class="page">
    <h1 class="page-title">Calendar</h1>
    <p class="subtitle">Approved events, one month back to one month ahead.</p>

    <!-- Same levels as the Wall: the Calendar opens on whatever you picked there -->
    <div class="cal-filter">
      <div class="level-toggle cal-tabs" role="tablist" aria-label="Event level">
        <button class="level-btn" data-cal="college" role="tab">College-wide <span class="cat-n" data-n="college">0</span></button>
        <div class="level-btn dept-seg" data-cal="department" role="tab">
          <span class="dept-label">Dept:</span>
          <select id="cal-dept" class="dept-pick" aria-label="Choose department"></select>
          <span class="cat-n" data-n="department">0</span>
        </div>
        <button class="level-btn" data-cal="inter" role="tab">Inter-college <span class="cat-n" data-n="inter">0</span></button>
      </div>
      <a class="clear-link" href="index.html">Open this view on the Wall →</a>
    </div>

    <div class="note" style="max-width:700px;margin:0 auto;">
      <div class="cal-header">
        <button class="btn secondary" id="prev-month">&larr; Prev</button>
        <h2 id="cal-month-label" style="margin:0;"></h2>
        <button class="btn secondary" id="next-month">Next &rarr;</button>
      </div>
      <div class="cal-grid" id="cal-dow-row"></div>
      <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
    </div>

    <div class="day-panel" id="day-panel"></div>
  </div>

  <script type="module" src="js/calendar.js"></script>
</body>
</html>
